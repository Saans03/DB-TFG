<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Top 10 - TFG</title>
    <style>
        /* Paleta Estilo Dark Mode */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        h1 { 
            color: #89b4fa; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        /* Contenedor de la Tabla */
        table {
            background-color: #313244;
            border-radius: 10px;
            overflow: hidden;
            width: 760px; 
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-collapse: collapse;
        }
        th {
            background-color: #45475a;
            color: #a6e3a1;
            padding: 15px;
            font-size: 18px;
            border-bottom: 2px solid #585b70;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #45475a;
            font-size: 16px;
        }
        tr:hover {
            background-color: #45475a;
            transition: background 0.2s ease;
        }
        
        /* Estilos especiales para el Podio (Top 3) */
        .gold { background-color: rgba(249, 226, 175, 0.1); color: #f9e2af; font-weight: bold; }
        .silver { background-color: rgba(180, 190, 244, 0.1); color: #b4befe; font-weight: bold; }
        .bronze { background-color: rgba(243, 139, 168, 0.1); color: #f38ba8; font-weight: bold; }
        
        .coin-icon {
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <h1>🏆 Ranking General - SteamPunk Game 🏆</h1>
    <table>
        <thead>
            <tr>
                <th>Puesto</th>
                <th>Jugador</th>
                <th>Puntuación</th>
                <th>Monedas</th>
                <th>Nivel</th>
            </tr>
        </thead>
        <tbody id="tabla-puntuaciones">
            </tbody>
    </table>

    <script>
        async function cargarRanking() {
            try {
                // 1. Detectamos automáticamente si hay un nivel en la URL (ej: index.html?nivel=nivel1)
                const urlParams = new URLSearchParams(window.location.search);
                const nivelFiltro = urlParams.get('nivel'); 

                // 2. Añadimos el filtro query string si existe
                let urlFetch = 'https://db-tfg.onrender.com/scores';
                if (nivelFiltro) {
                    urlFetch += `?nivel=${nivelFiltro}`;
                }

                const respuesta = await fetch(urlFetch);
                
                if (!respuesta.ok) {
                    throw new Error(`Error de servidor: ${respuesta.status}`);
                }

                const puntuaciones = await respuesta.json();
                const cuerpoTabla = document.getElementById('tabla-puntuaciones');
                cuerpoTabla.innerHTML = ''; 

                if (puntuaciones.length === 0) {
                    cuerpoTabla.innerHTML = '<tr><td colspan="5">No hay puntuaciones registradas para este nivel.</td></tr>';
                    return;
                }

                puntuaciones.forEach((partida, indice) => {
                    let claseMedalla = '';
                    if (indice === 0) claseMedalla = 'gold';    
                    if (indice === 1) claseMedalla = 'silver';  
                    if (indice === 2) claseMedalla = 'bronze';  

                    const numMonedas = partida.monedas !== undefined ? partida.monedas : 0;
                    
                    // 3. Mapeamos la variable actualizada 'nivel'
                    const maxNivel = partida.nivel || 'Ninguno'; 

                    const fila = `
                        <tr class="${claseMedalla}">
                            <td>#${indice + 1}</td>
                            <td>${partida.playerName || 'Anónimo'}</td>
                            <td>${partida.score || 0} <small>PT</small></td>
                            <td>${numMonedas} <span class="coin-icon">🪙</span></td>
                            <td><strong>${maxNivel}</strong></td>
                        </tr>
                    `;
                    cuerpoTabla.innerHTML += fila;
                });

            } catch (error) {
                console.error("Error al cargar el ranking:", error);
                document.getElementById('tabla-puntuaciones').innerHTML = 
                    '<tr><td colspan="5" style="color: #f38ba8; font-weight: bold; padding: 20px;">❌ Error al conectar con el servidor.</td></tr>';
            }
        }

        // Ejecución inicial y refresco automático cada 3 segundos
        cargarRanking();
        setInterval(cargarRanking, 3000);
    </script>
</body>
</html>
