<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Top 10 - TFG</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        h1 { 
            color: #89b4fa; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        h2 {
            color: #a6e3a1;
            margin-bottom: 20px;
        }
        
        /* Botonera de Niveles */
        .botones-nivel {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .botones-nivel button {
            background-color: #313244;
            color: #cdd6f4;
            border: 2px solid #45475a;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .botones-nivel button:hover, .botones-nivel button.activo {
            background-color: #89b4fa;
            color: #1e1e2e;
            border-color: #89b4fa;
        }

        table {
            background-color: #313244;
            border-radius: 10px;
            overflow: hidden;
            width: 700px; 
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-collapse: collapse;
        }
        th {
            background-color: #89b4fa;
            color: #1e1e2e;
            padding: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #45475a;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #45475a; transition: 0.3s; }

        .gold { color: #f9e2af; font-weight: bold; font-size: 1.2em; }
        .silver { color: #bac2de; font-weight: bold; font-size: 1.1em; }
        .bronze { color: #fab387; font-weight: bold; font-size: 1.05em; }
    </style>
</head>
<body>

    <h1>🏆 TOP 10 MEJORES JUGADORES 🏆</h1>
    <h2 id="titulo-nivel">Nivel 1</h2>

    <div class="botones-nivel">
        <button onclick="cambiarNivel('nivel1')" id="btn-nivel1" class="activo">Nivel 1</button>
        <button onclick="cambiarNivel('nivel2')" id="btn-nivel2">Nivel 2</button>
        <button onclick="cambiarNivel('nivel3')" id="btn-nivel3">Nivel 3</button>
        <button onclick="cambiarNivel('nivel4')" id="btn-nivel4">Nivel 4</button>
        <button onclick="cambiarNivel('nivel5')" id="btn-nivel5">Nivel 5</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Posición</th>
                <th>Jugador</th>
                <th>Puntuación</th>
                <th>Monedas</th> 
            </tr>
        </thead>
        <tbody id="tabla-puntuaciones">
            <tr><td colspan="4">Conectando con la base de datos...</td></tr>
        </tbody>
    </table>

    <script>
        let nivelActual = 'nivel1'; // Nivel por defecto al cargar la página

        function cambiarNivel(nuevoNivel) {
            nivelActual = nuevoNivel;
            
            // Actualizamos el título
            document.getElementById('titulo-nivel').innerText = nuevoNivel.toUpperCase();
            
            // Coloreamos el botón activo
            document.querySelectorAll('.botones-nivel button').forEach(btn => btn.classList.remove('activo'));
            document.getElementById('btn-' + nuevoNivel).classList.add('activo');
            
            // Recargamos los datos
            cargarRanking();
        }

        async function cargarRanking() {
            try {
                // 👈 NUEVO: Añadimos ?nivel= al final de la URL
                const respuesta = await fetch(`https://db-tfg.onrender.com/scores?nivel=${nivelActual}`);
                
                if (!respuesta.ok) {
                    throw new Error(`Error de servidor: ${respuesta.status}`);
                }

                const puntuaciones = await respuesta.json();
                const cuerpoTabla = document.getElementById('tabla-puntuaciones');
                cuerpoTabla.innerHTML = ''; 

                if (puntuaciones.length === 0) {
                    cuerpoTabla.innerHTML = '<tr><td colspan="4">Aún no hay puntuaciones en este nivel.</td></tr>';
                    return;
                }

                puntuaciones.forEach((partida, indice) => {
                    let claseMedalla = '';
                    if (indice === 0) claseMedalla = 'gold';    
                    if (indice === 1) claseMedalla = 'silver';  
                    if (indice === 2) claseMedalla = 'bronze';  

                    const numMonedas = partida.monedas !== undefined ? partida.monedas : 0;

                    const fila = `
                        <tr class="${claseMedalla}">
                            <td>#${indice + 1}</td>
                            <td>${partida.playerName || 'Anónimo'}</td>
                            <td>${partida.score || 0} <small>PT</small></td>
                            <td>${numMonedas} 🪙</td>
                        </tr>
                    `;
                    cuerpoTabla.innerHTML += fila;
                });

            } catch (error) {
                console.error("Error al cargar el ranking:", error);
                document.getElementById('tabla-puntuaciones').innerHTML = 
                    '<tr><td colspan="4" style="color: #f38ba8; font-weight: bold; padding: 20px;">❌ Error al conectar con el servidor.</td></tr>';
            }
        }

        cargarRanking();
        setInterval(cargarRanking, 3000);
    </script>
</body>
</html>
